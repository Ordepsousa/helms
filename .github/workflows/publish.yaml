name: Publish Helm Charts

on:
    push:
        branches: [ master ]
        paths:
            - 'charts/**'
            - '!charts/**/README.md'
            - '!charts/**/examples/**'
            - '!charts/**/docs/**'
            - '.github/workflows/publish.yaml'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: write
    packages: write
    id-token: write

env:
    HELM_VERSION: v3.15.4

jobs:
    detect:
        name: Detect changed charts
        runs-on: ubuntu-latest
        outputs:
            charts: ${{ steps.changed.outputs.charts }}
        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    fetch-depth: 0

            -   name: Detect changed charts
                id: changed
                run: |
                    CHANGED_CHART_LIST="[]"
                    
                    git fetch --tags --force 2>/dev/null || true
                    
                    for chart_dir in charts/*/; do
                      [ -d "$chart_dir" ] || continue
                      CHART=$(basename "$chart_dir")
                    
                      [ -f "charts/$CHART/Chart.yaml" ] || continue
                    
                      LATEST_TAG=$(git tag --sort=-v:refname | grep -E "^${CHART}-v[0-9]+\.[0-9]+\.[0-9]+$" | head -1)
                    
                      if [ -z "$LATEST_TAG" ]; then
                        echo "Chart '$CHART' has no previous tags. Marking as changed."
                        CHANGED_CHART_LIST=$(echo "$CHANGED_CHART_LIST" | jq --arg c "$CHART" '. + [$c]')
                      else
                        MODIFIED_FILES=$(git diff --name-only "$LATEST_TAG" HEAD -- "charts/$CHART/")
                    
                        FILTERED_FILES=$(echo "$MODIFIED_FILES" | grep -v -E '(README\.md|examples/|docs/)' || true)
                    
                        if [ -n "$FILTERED_FILES" ]; then
                          echo "Chart '$CHART' has changes since tag $LATEST_TAG."
                          CHANGED_CHART_LIST=$(echo "$CHANGED_CHART_LIST" | jq --arg c "$CHART" '. + [$c]')
                        else
                          echo "Chart '$CHART' has no relevant changes since $LATEST_TAG."
                        fi
                      fi
                    done
                    
                    UNIQUE_CHARTS=$(echo "$CHANGED_CHART_LIST" | jq -c 'unique')
                    
                    echo "charts=$UNIQUE_CHARTS" >> "$GITHUB_OUTPUT"
                    echo "Changed charts: $UNIQUE_CHARTS"

    publish:
        name: Publish - ${{ matrix.chart }}
        needs: detect
        if: needs.detect.outputs.charts != '[]' && needs.detect.outputs.charts != ''
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            max-parallel: 1
            matrix:
                chart: ${{ fromJson(needs.detect.outputs.charts) }}
        steps:
            -   name: Checkout
                uses: actions/checkout@v4
                with:
                    fetch-depth: 0

            -   name: Lowercase repository owner
                id: lowercase_owner
                run: |
                    echo "lowercase=${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]' >> "$GITHUB_OUTPUT"

            -   name: Calculate semantic version
                id: semver
                run: |
                    CHART="${{ matrix.chart }}"
                    LATEST_TAG=$(git tag --sort=-v:refname | grep -E "^${CHART}-v[0-9]+\.[0-9]+\.[0-9]+$" | head -1)
                    
                    if [ -z "$LATEST_TAG" ]; then
                      CHART_VERSION=$(grep '^version:' "charts/${CHART}/Chart.yaml" | awk '{print $2}')
                      if [ -n "$CHART_VERSION" ] && [ "$CHART_VERSION" != "0.1.0" ]; then
                        MAJOR=$(echo "$CHART_VERSION" | cut -d. -f1)
                        MINOR=$(echo "$CHART_VERSION" | cut -d. -f2)
                        PATCH=$(echo "$CHART_VERSION" | cut -d. -f3)
                        NEXT_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
                        BUMP_TYPE="patch"
                      else
                        NEXT_VERSION="1.0.0"
                        BUMP_TYPE="initial"
                      fi
                      echo "previous_tag=" >> "$GITHUB_OUTPUT"
                    else
                      CURRENT_VERSION="${LATEST_TAG#${CHART}-v}"
                      COMMITS=$(git log "${LATEST_TAG}..HEAD" --pretty=format:"%s" -- "charts/${CHART}/")
                    
                      if [ -z "$COMMITS" ]; then
                        echo "skip=true" >> "$GITHUB_OUTPUT"
                        exit 0
                      fi
                    
                      MAJOR=$(echo "$CURRENT_VERSION" | cut -d. -f1)
                      MINOR=$(echo "$CURRENT_VERSION" | cut -d. -f2)
                      PATCH=$(echo "$CURRENT_VERSION" | cut -d. -f3)
                    
                      if echo "$COMMITS" | grep -qE '^[a-z]+(\(.+\))?!:' || \
                         git log "${LATEST_TAG}..HEAD" --pretty=format:"%b" -- "charts/${CHART}/" | grep -q 'BREAKING CHANGE'; then
                        BUMP_TYPE="major"
                        NEXT_VERSION="$((MAJOR + 1)).0.0"
                      elif echo "$COMMITS" | grep -qE '^feat(\(.+\))?:'; then
                        BUMP_TYPE="minor"
                        NEXT_VERSION="${MAJOR}.$((MINOR + 1)).0"
                      else
                        BUMP_TYPE="patch"
                        NEXT_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
                      fi
                    
                      echo "previous_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
                    fi
                    
                    echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
                    echo "bump=$BUMP_TYPE" >> "$GITHUB_OUTPUT"
                    echo "tag=${CHART}-v${NEXT_VERSION}" >> "$GITHUB_OUTPUT"
                    echo "Bump: $BUMP_TYPE -> $NEXT_VERSION"

            -   name: Setup Helm
                if: steps.semver.outputs.skip != 'true'
                uses: azure/setup-helm@v5
                with:
                    version: ${{ env.HELM_VERSION }}

            -   name: Setup Cosign
                if: steps.semver.outputs.skip != 'true'
                uses: sigstore/cosign-installer@v4.1.0

            -   name: Login to GHCR
                if: steps.semver.outputs.skip != 'true'
                run: |
                    echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
                    echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            -   name: Setup GPG keyring
                if: steps.semver.outputs.skip != 'true'
                run: |
                    echo "${{ secrets.GPG_KEYRING }}" | base64 -d > /tmp/secring.gpg
                    echo "GPG keyring imported ($(wc -c < /tmp/secring.gpg) bytes)"

            -   name: Build Helm dependencies
                if: steps.semver.outputs.skip != 'true'
                run: helm dependency build charts/${{ matrix.chart }}

            -   name: Validate chart (Helm Lint)
                if: steps.semver.outputs.skip != 'true'
                run: helm lint charts/${{ matrix.chart }}

            -   name: Run render smoke tests
                if: steps.semver.outputs.skip != 'true' && hashFiles(format('charts/{0}/tests/render.sh', matrix.chart)) != ''
                run: ./charts/${{ matrix.chart }}/tests/render.sh

            -   name: Update Chart.yaml version
                if: steps.semver.outputs.skip != 'true'
                run: |
                    sed -i "s/^version:.*/version: ${{ steps.semver.outputs.version }}/" charts/${{ matrix.chart }}/Chart.yaml

            -   name: Package and push to OCI
                if: steps.semver.outputs.skip != 'true'
                id: push
                run: |
                    mkdir -p .dist
                    if [ -f /tmp/secring.gpg ] && [ -n "${{ secrets.GPG_KEY_NAME }}" ]; then
                      helm package charts/${{ matrix.chart }} --destination .dist \
                        --sign --key "${{ secrets.GPG_KEY_NAME }}" --keyring /tmp/secring.gpg
                    else
                      helm package charts/${{ matrix.chart }} --destination .dist
                    fi
                    
                    OCI_REGISTRY="oci://ghcr.io/${{ steps.lowercase_owner.outputs.lowercase }}/helm"
                    
                    for pkg in .dist/*.tgz; do
                      PUSH_OUTPUT=$(helm push "$pkg" "$OCI_REGISTRY" 2>&1)
                      echo "$PUSH_OUTPUT"
                      DIGEST=$(echo "$PUSH_OUTPUT" | grep -oE 'sha256:[a-f0-9]{64}')
                      echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
                    done

            -   name: Sign OCI artifact with Cosign
                if: steps.semver.outputs.skip != 'true' && steps.push.outputs.digest != ''
                env:
                    COSIGN_YES: "true"
                run: |
                    CHART="${{ matrix.chart }}"
                    DIGEST="${{ steps.push.outputs.digest }}"
                    cosign sign "ghcr.io/${{ steps.lowercase_owner.outputs.lowercase }}/helm/${CHART}@${DIGEST}"

            -   name: Commit version bump and tag
                if: steps.semver.outputs.skip != 'true'
                run: |
                    git config user.name "github-actions[bot]"
                    git config user.email "github-actions[bot]@users.noreply.github.com"
                    git add charts/${{ matrix.chart }}/Chart.yaml
                    git diff --cached --quiet || git commit -m "release(${{ matrix.chart }}): ${{ steps.semver.outputs.version }} [skip ci]"
                    
                    for attempt in 1 2 3 4 5; do
                      git pull --rebase origin master && break
                      sleep $((attempt * 2))
                    done
                    
                    git tag -a "${{ steps.semver.outputs.tag }}" -m "Release ${{ matrix.chart }} v${{ steps.semver.outputs.version }}"
                    
                    for attempt in 1 2 3 4 5; do
                      git push origin master --follow-tags && break
                      sleep $((attempt * 2))
                    done

            -   name: Create GitHub Release
                if: steps.semver.outputs.skip != 'true'
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    CHART="${{ matrix.chart }}"
                    VERSION="${{ steps.semver.outputs.version }}"
                    NOTES="/tmp/release-notes.md"
                    
                    echo "## $CHART v$VERSION" > "$NOTES"
                    echo "" >> "$NOTES"
                    git log "${{ steps.semver.outputs.previous_tag }}..HEAD" --pretty=format:"- %s" -- "charts/${CHART}/" >> "$NOTES" || true
                    
                    gh release create "${{ steps.semver.outputs.tag }}" \
                      --title "${{ matrix.chart }} v${{ steps.semver.outputs.version }}" \
                      --notes-file "$NOTES" \
                      --verify-tag
