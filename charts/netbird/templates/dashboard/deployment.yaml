apiVersion: apps/v1
kind: Deployment
metadata:
    name: {{ include "netbird.dashboardServiceName" . }}
    labels:
        {{- include "netbird.labels" . | nindent 8 }}
        app.kubernetes.io/component: dashboard
spec:
    replicas: {{ .Values.dashboard.replicaCount }}
    selector:
        matchLabels:
            {{- include "netbird.componentSelectorLabels" (dict "root" . "component" "dashboard") | nindent 12 }}
    template:
        metadata:
            {{- with .Values.dashboard.podAnnotations }}
            annotations:
                {{- toYaml . | nindent 16 }}
            {{- end }}
            labels:
                {{- include "netbird.componentSelectorLabels" (dict "root" . "component" "dashboard") | nindent 16 }}
                {{- with .Values.dashboard.podLabels }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
        spec:
            serviceAccountName: {{ include "netbird.serviceAccountName" . }}
            securityContext:
                {{- toYaml .Values.dashboard.podSecurityContext | nindent 16 }}
            containers:
                -   name: {{ .Chart.Name }}
                    securityContext:
                        {{ toYaml .Values.dashboard.securityContext | nindent 24 }}
                    image: "{{ .Values.dashboard.image.repository }}:{{ .Values.dashboard.image.tag | default .Chart.AppVersion }}{{ if .Values.dashboard.image.digest }}@{{ .Values.dashboard.image.digest }}{{ end }}"
                    imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
                    ports:
                        -   name: http
                            containerPort: {{ .Values.dashboard.service.port }}
                            protocol: TCP
                    env:
                        -   name: NETBIRD_MGMT_API_ENDPOINT
                            value: "https://{{ .Values.domain }}:443"
                        -   name: NETBIRD_MGMT_GRPC_API_ENDPOINT
                            value: "https://{{ .Values.domain }}:443"
                        -   name: AUTH_AUDIENCE
                            value: "netbird-dashboard"
                        -   name: AUTH_CLIENT_ID
                            value: "netbird-dashboard"
                        -   name: AUTH_CLIENT_SECRET
                            value: ""
                        -   name: AUTH_AUTHORITY
                            value: "https://{{ .Values.domain }}/oauth2"
                        -   name: USE_AUTH0
                            value: 'false'
                        -   name: AUTH_SUPPORTED_SCOPES
                            value: "openid profile email groups"
                        -   name: AUTH_REDIRECT_URI
                            value: "/nb-auth"
                        -   name: AUTH_SILENT_REDIRECT_URI
                            value: "/nb-silent-auth"
                        -   name: NGINX_SSL_PORT
                            value: "443"
                        -   name: LETSENCRYPT_DOMAIN
                            value: "none"
                        {{- range .Values.dashboard.env }}
                        -   name: {{ .name }}
                            {{- if hasKey . "valueFrom" }}
                            valueFrom:
                            {{- toYaml .valueFrom | nindent 28 }}
                            {{- else }}
                            value: {{ default "" .value | quote }}
                            {{- end }}
                        {{- end }}
                    {{- with .Values.dashboard.envFrom }}
                    envFrom:
                        {{- toYaml . | nindent 24 }}
                    {{- end }}
                    {{- if and .Values.dashboard.probes.enabled .Values.probes.startup.enabled }}
                    startupProbe:
                        httpGet:
                            path: /
                            port: http
                        initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
                        periodSeconds: {{ .Values.probes.startup.periodSeconds }}
                        timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
                        failureThreshold: {{ .Values.probes.startup.failureThreshold }}
                    {{- end }}
                    {{- if and .Values.dashboard.probes.enabled .Values.probes.liveness.enabled }}
                    livenessProbe:
                        httpGet:
                            path: /
                            port: http
                        initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
                        periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
                        timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
                        failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
                    {{- end }}
                    {{- if and .Values.dashboard.probes.enabled .Values.probes.readiness.enabled }}
                    readinessProbe:
                        httpGet:
                            path: /
                            port: http
                        initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
                        periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
                        timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
                        failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
                    {{- end }}
                    resources:
                        {{ toYaml .Values.dashboard.resources | nindent 24 }}
                    {{- with .Values.dashboard.extraVolumeMounts }}
                    volumeMounts:
                        {{ toYaml . | nindent 24 }}
                    {{- end }}
            {{- with .Values.dashboard.extraVolumes }}
            volumes:
                {{ toYaml . | nindent 16 }}
            {{- end }}
            {{- with .Values.dashboard.nodeSelector }}
            nodeSelector:
                {{- toYaml . | nindent 16 }}
            {{- end }}
            {{- with .Values.dashboard.affinity }}
            affinity:
                {{- toYaml . | nindent 16 }}
            {{- end }}
            {{- with .Values.dashboard.tolerations }}
            tolerations:
                {{- toYaml . | nindent 16 }}
            {{- end }}