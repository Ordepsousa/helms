{{- if and .Values.gateway.enabled (not .Values.ingress.enabled) -}}
{{- if .Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1/HTTPRoute" -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
    name: {{ include "netbird.fullname" . }}-dashboard
    labels:
        {{- include "netbird.labels" . | nindent 8 }}
spec:
    {{- with .Values.gateway.parentRefs }}
    parentRefs:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    hostnames:
        - {{ .Values.domain | quote }}
    rules:
        -   backendRefs:
                -   group: ''
                    kind: Service
                    name: {{ include "netbird.dashboardServiceName" . }}
                    port: {{ .Values.dashboard.service.port }}
                    weight: 1
            matches:
                -   path:
                        type: PathPrefix
                        value: /
            timeouts:
                request: 3600s
                backendRequest: 3600s
{{- end }}
{{- end }}