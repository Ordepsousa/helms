{{- if and .Values.bootstrap.enabled .Values.bootstrap.createUser .Values.bootstrap.generateAPIKey }}
{{- if .Values.bootstrap.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
    name: {{ include "netbird.bootstrapServiceAccountName" . }}
    labels:
        {{- include "netbird.labels" . | nindent 8 }}
        app.kubernetes.io/component: bootstrap
    {{- with .Values.bootstrap.serviceAccount.annotations }}
    annotations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
automountServiceAccountToken: true
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: {{ include "netbird.bootstrapServiceAccountName" . }}
    labels:
        {{- include "netbird.labels" . | nindent 8 }}
        app.kubernetes.io/component: bootstrap
rules:
    -   apiGroups: [ "" ]
        resources: [ "secrets" ]
        verbs: [ "get", "list", "create", "update", "patch" ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: {{ include "netbird.bootstrapServiceAccountName" . }}
    labels:
        {{- include "netbird.labels" . | nindent 8 }}
        app.kubernetes.io/component: bootstrap
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: {{ include "netbird.bootstrapServiceAccountName" . }}
subjects:
    -   kind: ServiceAccount
        name: {{ include "netbird.bootstrapServiceAccountName" . }}
{{- end }}
