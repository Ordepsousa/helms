{{- if and .Values.bootstrap.enabled .Values.bootstrap.createUser (not .Values.bootstrap.existingCredentialsSecret) }}
apiVersion: v1
kind: Secret
metadata:
    name: {{ include "netbird.bootstrapCredentialsSecretName" . }}
    labels:
        {{- include "netbird.labels" . | nindent 8 }}
        app.kubernetes.io/component: bootstrap
stringData:
    {{ .Values.bootstrap.credentials.emailKey }}: {{ required "bootstrap.credentials.email is required when no existingCredentialsSecret is configured" .Values.bootstrap.credentials.email | quote }}
    {{ .Values.bootstrap.credentials.nameKey }}: {{ required "bootstrap.credentials.name is required when no existingCredentialsSecret is configured" .Values.bootstrap.credentials.name | quote }}
    {{ .Values.bootstrap.credentials.passwordKey }}: {{ required "bootstrap.credentials.password is required when no existingCredentialsSecret is configured" .Values.bootstrap.credentials.password | quote }}
{{- end }}
