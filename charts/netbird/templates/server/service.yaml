apiVersion: v1
kind: Service
metadata:
    name: {{ include "netbird.serverServiceName" . }}
    labels:
        {{- include "netbird.labels" . | nindent 8 }}
spec:
    type: {{ .Values.server.services.http.type }}
    ports:
        -   name: http
            targetPort: http
            protocol: TCP
            port: {{ .Values.server.services.http.port }}
            appProtocol: kubernetes.io/ws
        {{- if .Values.metrics.enabled }}
        -   name: metrics
            port: {{ .Values.metrics.port }}
            targetPort: metrics
            protocol: TCP
        {{- end}}
    selector:
        {{- include "netbird.componentSelectorLabels" (dict "root" . "component" "server") | nindent 8 }}