{{- if and .Values.gateway.enabled (not .Values.ingress.enabled) -}}
{{- if .Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1alpha2/UDPRoute" -}}
{{- $fullName := include "netbird.fullname" . -}}
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: UDPRoute
metadata:
    name: {{ $fullName }}-stun
    labels:
        {{- include "netbird.labels" . | nindent 8 }}
    {{- with .Values.gateway.annotations }}
    annotations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
spec:
    {{- with .Values.gateway.parentRefs }}
    parentRefs:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    rules:
        -   backendRefs:
                -   group: ''
                    kind: Service
                    name: {{ include "netbird.stunServiceName" . }}
                    port: {{ .Values.server.services.stun.port }}
{{- end }}
{{- end }}