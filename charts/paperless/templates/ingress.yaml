{{- if and .Values.ingress.enabled (not .Values.httproute.enabled) }}
apiVersion: {{ include "common.capabilities.ingress.apiVersion" . }}
kind: Ingress
metadata:
    name: {{ include "paperless.webServerName" . }}
    namespace: {{ include "common.names.namespace" . | quote }}
    labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 8 }}
        app.kubernetes.io/component: webserver
    {{- if or .Values.ingress.annotations .Values.commonAnnotations .Values.ingress.certManager }}
    annotations:
        {{- if .Values.ingress.certManager }}
        kubernetes.io/tls-acme: "true"
        {{- end }}
        {{- if or .Values.ingress.annotations .Values.commonAnnotations }}
            {{- $annotations := include "common.tplvalues.merge" ( dict "values" ( list .Values.ingress.annotations .Values.commonAnnotations ) "context" . ) }}
            {{- include "common.tplvalues.render" ( dict "value" $annotations "context" $) | nindent 8 }}
        {{- end }}
    {{- end }}
spec:
    {{- if .Values.ingress.ingressClassName }}
    ingressClassName: {{ .Values.ingress.ingressClassName | quote }}
    {{- end }}
    rules:
        {{- if .Values.ingress.hostname }}
        -   host: {{ .Values.ingress.hostname }}
            http:
                paths:
                    {{- if .Values.ingress.extraPaths }}
                    {{- toYaml .Values.ingress.extraPaths | nindent 20 }}
                    {{- end }}
                    -   path: {{ .Values.ingress.path }}
                        pathType: {{ .Values.ingress.pathType }}
                        backend: {{- include "common.ingress.backend" (dict "serviceName" (include "paperless.webServerName" .) "servicePort" (ternary "https" "http" .Values.ingress.tls) "context" $)  | nindent 28 }}
        {{- end }}
        {{- range .Values.ingress.extraHosts }}
        -   host: {{ .name | quote }}
            http:
                paths:
                    -   path: {{ default "/" .path }}
                        pathType: {{ default "ImplementationSpecific" .pathType }}
                        backend: {{- include "common.ingress.backend" (dict "serviceName" (include "paperless.webServerName" $) "servicePort" (ternary "https" "http" $.Values.ingress.tls) "context" $) | nindent 28 }}
        {{- end }}
        {{- if .Values.ingress.extraRules }}
        {{- include "common.tplvalues.render" (dict "value" .Values.ingress.extraRules "context" $) | nindent 8 }}
        {{- end }}
    {{- if or .Values.ingress.tls .Values.ingress.extraTls }}
    tls:
        {{- if .Values.ingress.tls }}
        -   hosts:
                - {{ .Values.ingress.hostname }}
            secretName: {{ printf "%s-tls" .Values.ingress.hostname }}
        {{- end }}
        {{- if .Values.ingress.extraTls }}
        {{- include "common.tplvalues.render" ( dict "value" .Values.ingress.extraTls "context" $ ) | nindent 8 }}
        {{- end }}
    {{- end }}
{{- end }}
