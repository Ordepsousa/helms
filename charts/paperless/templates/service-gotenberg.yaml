{{- if .Values.core.gotenberg.enabled }}
apiVersion: v1
kind: Service
metadata:
    name: {{ include "paperless.gotenbergServiceName" . }}
    namespace: {{ include "common.names.namespace" . | quote }}
    {{- $labels := .Values.commonLabels }}
    {{- if .Values.core.gotenberg.service.labels }}
    {{- $labels = include "common.tplvalues.merge" ( dict "values" ( list .Values.core.gotenberg.service.labels $labels ) "context" . ) }}
    {{- end }}
    labels: {{- include "common.labels.standard" ( dict "customLabels" $labels "context" $ ) | nindent 8 }}
        app.kubernetes.io/component: core
    {{- if or .Values.commonAnnotations .Values.core.gotenberg.service.annotations }}
    {{- $annotations := include "common.tplvalues.merge" ( dict "values" ( list .Values.core.gotenberg.service.annotations .Values.commonAnnotations ) "context" . ) }}
    annotations: {{- include "common.tplvalues.render" ( dict "value" $annotations "context" $) | nindent 4 }}
    {{- end }}
spec:
    type: {{ .Values.core.gotenberg.service.type }}
    ports:
        -   name: http
            targetPort: gotenberg-http
            protocol: TCP
            port: {{ .Values.core.gotenberg.service.port }}
    {{- $podLabels := include "common.tplvalues.merge" ( dict "values" ( list .Values.core.podLabels .Values.commonLabels ) "context" . ) }}
    selector: {{- include "common.labels.matchLabels" ( dict "customLabels" $podLabels "context" $ ) | nindent 8 }}
        app.kubernetes.io/component: core
{{- end }}
