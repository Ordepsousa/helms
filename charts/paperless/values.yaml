    podAnnotations: { }
    ## apiTokenJob image version
    ## @param apiTokenJob.image.registry apiTokenJob image registry
    ## @param apiTokenJob.image.repository apiTokenJob image repository
    ## @skip apiTokenJob.image.tag apiTokenJob image tag (immutable tags are recommended)
    ## @param apiTokenJob.image.digest apiTokenJob image digest in the way sha256:aa.... Please note this parameter, if set, will override the tag
    ## @param apiTokenJob.image.pullPolicy apiTokenJob image pull policy
