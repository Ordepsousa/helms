## Configure the ingress for the webserver. Disabled when Gateway API is enabled
## Ref: https://kubernetes.io/docs/concepts/services-networking/ingress/
## @param ingress.enabled Enable the creation of an ingress for the webserver
## @param ingress.pathType Path type for the webserver ingress
## @param ingress.apiVersion Ingress API version for the webserver ingress
## @param ingress.hostname Ingress hostname for the webserver ingress
## @param ingress.annotations Annotations for the webserver ingress. To enable certificate autogeneration, place here your cert-manager annotations.
## @param ingress.tls Enable TLS for the webserver ingress
## @param ingress.extraHosts Extra hosts array for the webserver ingress
## @param ingress.path Path array for the webserver ingress
## @param ingress.extraPaths Extra paths for the webserver ingress
## @param ingress.extraTls Extra TLS configuration for the webserver ingress
## @param ingress.secrets Secrets array to mount into the Ingress
## @param ingress.ingressClassName IngressClass that will be be used to implement the Ingress (Kubernetes 1.18+)
##
ingress:
    ## Set to true to enable ingress record generation
    ##
    enabled: false
    ## @param server.ingress.selfSigned Create a TLS secret for this ingress record using self-signed certificates generated by Helm
    ##
    selfSigned: false

    ## Ingress Path type
    ##
    pathType: ImplementationSpecific
    ## Override API Version (automatically detected if not set)
    ##
    apiVersion: ""
    ## When the ingress is enabled, a host pointing to this will be created
    ##
    hostname: paperless.domain
    ## The Path to webserver. You may need to set this to '/*' in order to use this
    ## with ALB ingress controllers.
    ##
    path: /
    ## For a full list of possible ingress annotations, please see
    ## ref: https://github.com/kubernetes/ingress-nginx/blob/main/docs/user-guide/nginx-configuration/annotations.md
    ## Use this parameter to set the required annotations for cert-manager, see
    ## ref: https://cert-manager.io/docs/usage/ingress/#supported-annotations
    ##
    ## e.g:
    ## annotations:
    ##   kubernetes.io/ingress.class: nginx
    ##   cert-manager.io/cluster-issuer: cluster-issuer-name
    ##
    annotations: { }
    ## Enable TLS configuration for the hostname defined at ingress.hostname parameter
    ## TLS certificates will be retrieved from a TLS secret with name: {{- printf "%s-tls" .Values.ingress.hostname }}
    ## You can use the ingress.secrets parameter to create this TLS secret or rely on cert-manager to create it
    ##
    tls: false
    ## The list of additional hostnames to be covered with this ingress record.
    ## Most likely the hostname above will be enough, but in the event more hosts are needed, this is an array
    extraHosts: [ ]
    ## - name: paperless.domain
    ##   path: /
    ##

    ## Any additional arbitrary paths that may need to be added to the ingress under the main host.
    ## For example: The ALB ingress controller requires a special rule for handling SSL redirection.
    extraPaths: [ ]
    ## - path: /*
    ##   backend:
    ##     serviceName: ssl-redirect
    ##     servicePort: use-annotation
    ##

    ## The tls configuration for additional hostnames to be covered with this ingress record.
    ## see: https://kubernetes.io/docs/concepts/services-networking/ingress/#tls
    extraTls: [ ]
    ## - hosts:
    ##     - paperless.domain
    ##   secretName: paperless.domain-tls
    ##

    ## If you're providing your own certificates, please use this to add the certificates as secrets
    ## key and certificate should start with -----BEGIN CERTIFICATE----- or
    ## -----BEGIN RSA PRIVATE KEY-----
    ##
    ## name should line up with a tlsSecret set further up
    ## If you're using cert-manager, this is unneeded, as it will create the secret for you if it is not set
    ##
    ## It is also possible to create and manage the certificates outside of this helm chart
    ## Please see README.md for more information
    ##
    secrets: [ ]
    ## - name: paperless.domain-tls
    ##   key:
    ##   certificate:
    ##

    ## This is supported in Kubernetes 1.18+ and required if you have more than one IngressClass marked as the default for your cluster .
    ## ref: https://kubernetes.io/blog/2020/04/02/improvements-to-the-ingress-api-in-kubernetes-1.18/
    ##
    ingressClassName: ""
    ## @param server.ingress.extraRules Additional rules to be covered with this ingress record
    ## ref: https://kubernetes.io/docs/concepts/services-networking/ingress/#ingress-rules
    ## e.g:
    ## extraRules:
    ## - host: example.local
    ##     http:
    ##       path: /
    ##       backend:
    ##         service:
    ##           name: example-svc
    ##           port:
    ##             name: http
    ##
    extraRules: [ ]
## @section httproute Gateway API HTTPRoute configuration
## ref: https://gateway-api.sigs.k8s.io/api-types/httproute/
##
httproute:
    ## @param httproute.enabled Enable HTTPRoute generation for webserver
    ##
    enabled: false
    ## @param httproute.annotations Additional annotations for the HTTPRoute resource
    ##
    annotations: { }
    ## @param httproute.labels Additional labels for the HTTPRoute resource
    ##
    labels: { }
    ## @param httproute.parentRefs Gateways the HTTPRoute is attached to. If unspecified, it'll be attached to Gateway named 'gateway' in the same namespace.
    ## e.g:
    ## parentRefs:
    ##   - name: my-gateway
    ##     sectionName: http
    ##     namespace: default
    ##
    parentRefs: [ ]
    ## @param httproute.hostnames List of hostnames matching HTTP header
    ##
    hostnames:
        - paperless.domain
    ## @param httproute.matches List of match rules applied to the HTTPRoute for the default svc backend reference
    ##
    matches:
        -   path:
                type: PathPrefix
                value: /
    ## @param httproute.filters List of filter rules applied to the HTTPRoute for the default svc backend reference
    ##
    filters: [ ]
    ## @param httproute.extraRules List of extra rules applied to the HTTPRoute
    ## e.g:
    ## extraRules:
    ##   - matches:
    ##       - path:
    ##           type: PathPrefix
    ##           value: /
    ##     backendRefs:
    ##       - name: paperless-webserver
    ##         port: 80
    ##
    extraRules: [ ]
## Enable persistence using Persistent Volume Claims
## ref: https://kubernetes.io/docs/concepts/storage/persistent-volumes/
##
persistence:
    data:
        ## @param persistence.data.enabled Enable data (search index, SQLite database, classification model, etc) persistence using PVC
        ##
        enabled: true
        ## @param persistence.data.volumeName Name to assign the volume
        ##
        volumeName: "data"
        ## @param persistence.data.existingClaim Name of an existing PVC to use
        ##
        existingClaim: ""
        ## @param persistence.data.mountPath The path the volume will be mounted at
        ##
        mountPath: /var/paperless/data
        ## @param persistence.data.subPath The subdirectory of the volume to mount to
        ## Useful in dev environments and one PV for multiple services
        ##
        subPath: ""
        ## @param persistence.data.storageClass PVC Storage Class for data volume
        ##
        storageClass: ""
        ## @param persistence.data.accessModes PVC Access Mode for data volume
        ##
        accessModes:
            - ReadWriteOnce
        ## @param persistence.data.size PVC Storage Request for data volume
        ##
        size: 10Gi
        ## @param persistence.data.annotations Annotations for the PVC
        ##
        annotations: { }
        ## @param persistence.data.labels Labels for the PVC
        ##
        labels: { }
        ## @param persistence.data.selector Selector to match an existing Persistent Volume (this value is evaluated as a template)
        ## selector:
        ##   matchLabels:
        ##     app: my-app
        ##
        selector: { }
        ## @param persistence.data.dataSource Custom PVC data source
        ##
        dataSource: { }
    media:
        ## @param persistence.data.enabled Enable data (search index, SQLite database, classification model, etc) persistence using PVC
        ##
        enabled: true
        ## @param persistence.data.volumeName Name to assign the volume
        ##
        volumeName: "media"
        ## @param persistence.data.existingClaim Name of an existing PVC to use
        ##
        existingClaim: ""
        ## @param persistence.data.mountPath The path the volume will be mounted at
        ##
        mountPath: /var/paperless/media
        ## @param persistence.data.subPath The subdirectory of the volume to mount to
        ## Useful in dev environments and one PV for multiple services
        ##
        subPath: ""
        ## @param persistence.data.storageClass PVC Storage Class for data volume
        ##
        storageClass: ""
        ## @param persistence.data.accessModes PVC Access Mode for data volume
        ##
        accessModes:
            - ReadWriteOnce
        ## @param persistence.data.size PVC Storage Request for data volume
        ##
        size: 10Gi
        ## @param persistence.data.annotations Annotations for the PVC
        ##
        annotations: { }
        ## @param persistence.data.labels Labels for the PVC
        ##
        labels: { }
        ## @param persistence.data.selector Selector to match an existing Persistent Volume (this value is evaluated as a template)
        ## selector:
        ##   matchLabels:
        ##     app: my-app
        ##
        selector: { }
        ## @param persistence.data.dataSource Custom PVC data source
        ##
        dataSource: { }
        # -- Configuration for NFS server.
        nfs:
            server: ""
            path: ""
    consume:
        ## @param persistence.data.enabled Enable data (search index, SQLite database, classification model, etc) persistence using PVC
        ##
        enabled: false
        ## @param persistence.data.volumeName Name to assign the volume
        ##
        volumeName: "consume"
        ## @param persistence.data.existingClaim Name of an existing PVC to use
        ##
        existingClaim: ""
        ## @param persistence.data.mountPath The path the volume will be mounted at
        ##
        mountPath: /var/paperless/consume
        ## @param persistence.data.subPath The subdirectory of the volume to mount to
        ## Useful in dev environments and one PV for multiple services
        ##
        subPath: ""
        ## @param persistence.data.storageClass PVC Storage Class for data volume
        ##
        storageClass: ""
        ## @param persistence.data.accessModes PVC Access Mode for data volume
        ##
        accessModes:
            - ReadWriteOnce
        ## @param persistence.data.size PVC Storage Request for data volume
        ##
        size: 1Gi
        ## @param persistence.data.annotations Annotations for the PVC
        ##
        annotations: { }
        ## @param persistence.data.labels Labels for the PVC
        ##
        labels: { }
        ## @param persistence.data.selector Selector to match an existing Persistent Volume (this value is evaluated as a template)
        ## selector:
        ##   matchLabels:
        ##     app: my-app
        ##
        selector: { }
        ## @param persistence.data.dataSource Custom PVC data source
        ##
        dataSource: { }
        # -- Configuration for NFS server
        nfs:
            server: ""
            path: ""
## @section PostgreSQL chart configuration
## ref: https://github.com/bitnami/charts/blob/main/bitnami/postgresql/values.yaml
## @param postgresql.enabled Switch to enable or disable the PostgreSQL helm chart
## @param postgresql.auth.username Name for a custom user to create
## @param postgresql.auth.password Password for the custom user to create
## @param postgresql.auth.database Name for a custom database to create
## @param postgresql.auth.existingSecret Name of existing secret to use for PostgreSQL credentials
## @param postgresql.architecture PostgreSQL architecture (`standalone` or `replication`)
## @param postgresql.primary.service.ports.postgresql PostgreSQL service port
##
postgresql:
    enabled: true
    auth:
        username: paperless
        password: ""
        database: paperless
        existingSecret: ""
    architecture: standalone
    primary:
        service:
            ports:
                postgresql: 5432
## @section Dragonfly chart configuration
## ref: https://github.com/dragonflydb/dragonfly/blob/main/contrib/charts/dragonfly/values.yaml
## @param dragonfly.enabled Switch to enable or disable the Dragonfly helm chart
## @param dragonfly.service.port Dragonfly service port
##
dragonfly:
    enabled: true
    service:
        port: 6379