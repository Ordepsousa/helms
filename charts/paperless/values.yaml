        ## @param core.gotenberg.readinessProbe.failureThreshold Failure threshold for readinessProbe
        ## @param core.gotenberg.readinessProbe.successThreshold Success threshold for readinessProbe
        ##
        readinessProbe:
            enabled: true
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 30
            failureThreshold: 20
            successThreshold: 1
        ## @param core.gotenberg.startupProbe.enabled Enable startupProbe on gotenberg container
        ## @param core.gotenberg.startupProbe.initialDelaySeconds Initial delay seconds for startupProbe
        ## @param core.gotenberg.startupProbe.periodSeconds Period seconds for startupProbe
        ## @param core.gotenberg.startupProbe.timeoutSeconds Timeout seconds for startupProbe
        ## @param core.gotenberg.startupProbe.failureThreshold Failure threshold for startupProbe
        ## @param core.gotenberg.startupProbe.successThreshold Success threshold for startupProbe
        ##
        startupProbe:
