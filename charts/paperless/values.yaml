        ## Configure extra options for gotenberg container liveness, readiness and startup probes
        ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/#configure-probes
        ## @param core.gotenberg.livenessProbe.enabled Enable livenessProbe on gotenberg container
