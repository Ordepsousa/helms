## @section Global parameters
## Please, note that this will override the parameters, including dependencies, configured to use the global value
##
global:
    ## @param global.imagePullSecrets Global Docker registry secret names as an array
    ## e.g.
    ## imagePullSecrets:
    ##   - myRegistryKeySecretName
    ##
    imagePullSecrets: [ ]
    ## @param global.defaultStorageClass Global default StorageClass for Persistent Volume(s)
    ##
    defaultStorageClass: ""
## @param nameOverride String to partially override common.names.fullname template (will maintain the release name)
##
nameOverride: ""
## @param fullnameOverride String to fully override common.names.fullname template
##
fullnameOverride: ""
## @param namespaceOverride String to fully override common.names.namespace
##
namespaceOverride: ""
## @param commonLabels Add labels to all the deployed resources
##
commonLabels: { }
## @param commonAnnotations Add annotations to all the deployed resources
##
commonAnnotations: { }
## @param secretAnnotations Add annotations to the secrets
##
secretAnnotations: { }
## Service account shared by the all Pods.
## ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
##
serviceAccount:
    ## @param serviceAccount.create Enable creation of ServiceAccount
    ##
    create: true
    ## @param serviceAccount.name The name of the ServiceAccount to use.
    ## If not set and create is true, a name is generated using the common.names.fullname template
    ##
    name: ""
    ## @param serviceAccount.automount Allows auto mount of ServiceAccountToken on the serviceAccount created
    ## Can be set to false if pods using this serviceAccount do not need to use K8s API
    ##
    automount: false
    ## @param serviceAccount.annotations Additional custom annotations for the ServiceAccount
    ##
    annotations: { }
## paperless-ngx image version
## @param image.registry paperless-ngx image registry
## @param image.repository paperless-ngx image repository
## @skip image.tag paperless-ngx image tag (immutable tags are recommended)
## @param image.digest paperless-ngx image digest in the way sha256:aa.... Please note this parameter, if set, will override the tag
## @param image.pullPolicy paperless-ngx image pull policy
## @param image.pullSecrets Specify image pull secrets
## @param image.debug Specify if debug values should be set
##
image:
    registry: ghcr.io
    repository: paperless-ngx/paperless-ngx
    tag: latest
    digest: ""
    ## Specify a imagePullPolicy
    ## ref: https://kubernetes.io/docs/concepts/containers/images/#pre-pulled-images
    ##
    pullPolicy: IfNotPresent
    ## Optionally specify an array of imagePullSecrets.
    ## Secrets must be manually created in the namespace.
    ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
    ## e.g:
    ## pullSecrets:
    ##   - myRegistryKeySecretName
    ##
    pullSecrets: [ ]
    ## Set to true if you would like to see extra information on logs
    ##
    debug: false
## @section config parameters
##
config:
    ## @param config.domain Url where paperless is reachable via browser (including http(s)://)
    ##
    domain: "https://paperless.domain"
    ## paperless OCR configuration
    ## @param config.ocr.installLanguages Array of languages to be installed for ocr
    ## @param config.ocr.languages Array of languages to be used for ocr
    ocr:
        installLanguages:
            - eng
        languages:
            - eng
    ## @param config.secretKey required secret key - PAPERLESS_SECRET_KEY
    ## example generation: openssl rand -base64 32
    ##
    secretKey: ""
    ## @param config.existingSecret Existing Secret containing the secretKey. Preferred in production
    ##
    existingSecret: ""
    ## @param config.createUser Create the paperless admin user
    ##
    createUser: false
    ## @param config.existingCredentialsSecret Existing Secret containing credentials.
    ##
    existingCredentialsSecret: ""
    ## @param config.credentials Credentials used only when existingCredentialsSecret is empty. Prefer an external Secret in production
    ##
    credentials:
        mail: ""
        name: ""
        password: ""
    ## Redis-compatible broker selection and external connection settings
    ## Works with Redis, Valkey, Dragonfly, or any Redis-compatible broker
    ## @param config.redis.external.host External broker hostname. Empty allows bundled broker resolution
    ## @param config.redis.external.port External broker port
    ## @param config.redis.external.username External broker username
    ## @param config.redis.external.password External broker password. Ignored when existingSecret is set
    ## @param config.redis.external.existingSecret Existing Secret containing the external broker password
    ## @param config.redis.external.index External broker database index
    ##
    redis:
        external:
            host: ""
            port: 6379
            username: ""
            password: ""
            existingSecret: ""
            index: "0"
    ## Database selection and external database connection settings
    ## @param config.database.mode Store mode: auto, sqlite, postgresql or external. Auto selects external configuration, then bundled PostgreSQL, then SQLite
    ## @param config.database.external.engine External engine: postgres or mysql.
    ## @param config.database.external.host External database hostname. Empty allows bundled PostgreSQL resolution
    ## @param config.database.external.port External database port
    ## @param config.database.external.name External database name
    ## @param config.database.external.username External database username
    ## @param config.database.external.password External database password. Ignored when existingSecret is set
    ## @param config.database.external.existingSecret Existing Secret containing the external database password
    ## @param config.database.external.existingSecretPasswordKey Key in existingSecret containing the password
    ##
    database:
        mode: auto
        external:
            engine: postgres
            host: ""
            port: 5432
            name: paperless
            username: paperless
            password: ""
            existingSecret: ""
            existingSecretPasswordKey: database-password
## @section core parameters
##
core:
    ## @param core.labels Map of labels to add to core deployment
    ##
    labels: { }
    ## @param core.annotations Annotations for core pods
    ##
    annotations: { }
    ## @param core.podLabels Map of labels to add to core pods
    ##
    podLabels: { }
    ## @param core.podAnnotations Map of annotations to add to core pods
    ##
    podAnnotations: { }
    ## Pod Security Context
    ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
    ## @param core.podSecurityContext.enabled Enable security context
    ## @param core.podSecurityContext.fsGroupChangePolicy Set filesystem group change policy
    ## @param core.podSecurityContext.fsGroup Group ID for the pod
    ##
    podSecurityContext:
        enabled: true
        fsGroupChangePolicy: OnRootMismatch
        fsGroup: 1000
    ## @param core.affinity Affinity for core pods assignment
    ## ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
    ## Note: core.podAffinityPreset, core.podAntiAffinityPreset, and core.nodeAffinityPreset will be ignored when it's set
    ##
    affinity: { }
    ## @param core.nodeSelector Node labels for core pods assignment
    ## ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/
    ##
    nodeSelector: { }
    ## @param core.tolerations Tolerations for core pods assignment
    ## ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
    ##
    tolerations: [ ]
    ## @param core.extraVolumes Optionally specify extra list of additional volumes for the core containers
    ##
    extraVolumes: [ ]
    migrations:
        ## @param core.migrations.extraEnvVars Array with extra environment variables to add to migrations initContainer
        ## e.g:
        ## extraEnvVars:
        ##   - name: FOO
        ##     value: "bar"
        ##
        extraEnvVars: [ ]
        ## @param core.migrations.resources Set container requests and limits for different resources like CPU or memory (essential for production workloads)
        ## Example:
        ## resources:
        ##   requests:
        ##     cpu: 2
        ##     memory: 512Mi
        ##   limits:
        ##     cpu: 3
        ##     memory: 1024Mi
        ##
        resources: { }
        ## Container Security Context
        ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
        ## @param core.migrations.containerSecurityContext.enabled Enabled containers' Security Context
        ## @param core.migrations.containerSecurityContext.seLinuxOptions [object,nullable] Set SELinux options in container
        ## @param core.migrations.containerSecurityContext.runAsUser Set containers' Security Context runAsUser
        ## @param core.migrations.containerSecurityContext.runAsGroup Set containers' Security Context runAsGroup
        ## @param core.migrations.containerSecurityContext.runAsNonRoot Set container's Security Context runAsNonRoot
        ## @param core.migrations.containerSecurityContext.privileged Set container's Security Context privileged
        ## @param core.migrations.containerSecurityContext.readOnlyRootFilesystem Set container's Security Context readOnlyRootFilesystem
        ## @param core.migrations.containerSecurityContext.allowPrivilegeEscalation Set container's Security Context allowPrivilegeEscalation
        ## @param core.migrations.containerSecurityContext.capabilities.drop List of capabilities to be dropped
        ## @param core.migrations.containerSecurityContext.seccompProfile.type Set container's Security Context seccomp profile
        ##
        containerSecurityContext:
            enabled: true
            seLinuxOptions: { }
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            privileged: false
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
                drop: [ "ALL" ]
            seccompProfile:
                type: "RuntimeDefault"
        ## @param core.migrations.extraVolumeMounts Optionally specify extra list of additional volumeMounts for the migrations initContainer
        ##
        extraVolumeMounts: [ ]
    consumer:
        ## @param core.consumer.extraEnvVars Array with extra environment variables to add to consumer container
        ## e.g:
        ## extraEnvVars:
        ##   - name: FOO
        ##     value: "bar"
        ##
        extraEnvVars: [ ]
        ## @param core.consumer.resources Set container requests and limits for different resources like CPU or memory (essential for production workloads)
        ## Example:
        ## resources:
        ##   requests:
        ##     cpu: 2
        ##     memory: 512Mi
        ##   limits:
        ##     cpu: 3
        ##     memory: 1024Mi
        ##
        resources: { }
        ## Container Security Context
        ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
        ## @param core.consumer.containerSecurityContext.enabled Enabled containers' Security Context
        ## @param core.consumer.containerSecurityContext.seLinuxOptions [object,nullable] Set SELinux options in container
        ## @param core.consumer.containerSecurityContext.runAsUser Set containers' Security Context runAsUser
        ## @param core.consumer.containerSecurityContext.runAsGroup Set containers' Security Context runAsGroup
        ## @param core.consumer.containerSecurityContext.runAsNonRoot Set container's Security Context runAsNonRoot
        ## @param core.consumer.containerSecurityContext.privileged Set container's Security Context privileged
        ## @param core.consumer.containerSecurityContext.readOnlyRootFilesystem Set container's Security Context readOnlyRootFilesystem
        ## @param core.consumer.containerSecurityContext.allowPrivilegeEscalation Set container's Security Context allowPrivilegeEscalation
        ## @param core.consumer.containerSecurityContext.capabilities.drop List of capabilities to be dropped
        ## @param core.consumer.containerSecurityContext.seccompProfile.type Set container's Security Context seccomp profile
        ##
        containerSecurityContext:
            enabled: true
            seLinuxOptions: { }
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            privileged: false
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
                drop: [ "ALL" ]
            seccompProfile:
                type: "RuntimeDefault"
        ## @param core.consumer.extraVolumeMounts Optionally specify extra list of additional volumeMounts for the consumer container
        ##
        extraVolumeMounts: [ ]
    scheduler:
        ## @param core.scheduler.extraEnvVars Array with extra environment variables to add to scheduler container
        ## e.g:
        ## extraEnvVars:
        ##   - name: FOO
        ##     value: "bar"
        ##
        extraEnvVars: [ ]
        ## @param core.scheduler.resources Set container requests and limits for different resources like CPU or memory (essential for production workloads)
        ## Example:
        ## resources:
        ##   requests:
        ##     cpu: 2
        ##     memory: 512Mi
        ##   limits:
        ##     cpu: 3
        ##     memory: 1024Mi
        ##
        resources: { }
        ## Container Security Context
        ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
        ## @param core.scheduler.enabled Enabled containers' Security Context
        ## @param core.scheduler.seLinuxOptions [object,nullable] Set SELinux options in container
        ## @param core.scheduler.runAsUser Set containers' Security Context runAsUser
        ## @param core.scheduler.runAsGroup Set containers' Security Context runAsGroup
        ## @param core.scheduler.runAsNonRoot Set container's Security Context runAsNonRoot
        ## @param core.scheduler.privileged Set container's Security Context privileged
        ## @param core.scheduler.readOnlyRootFilesystem Set container's Security Context readOnlyRootFilesystem
        ## @param core.scheduler.allowPrivilegeEscalation Set container's Security Context allowPrivilegeEscalation
        ## @param core.scheduler.capabilities.drop List of capabilities to be dropped
        ## @param core.scheduler.seccompProfile.type Set container's Security Context seccomp profile
        ##
        containerSecurityContext:
            enabled: true
            seLinuxOptions: { }
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            privileged: false
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
                drop: [ "ALL" ]
            seccompProfile:
                type: "RuntimeDefault"
        ## @param core.scheduler.extraVolumeMounts Optionally specify extra list of additional volumeMounts for the scheduler container
        ##
        extraVolumeMounts: [ ]
    tika:
        ## @param core.tika.enabled Enable Apache Tika service
        enabled: true
        ## tika image version
        ## @param core.tika.image.registry tika image registry
        ## @param core.tika.image.repository tika image repository
        ## @skip core.tika..imagetag tika image tag (immutable tags are recommended)
        ## @param core.tika.image.digest tika image digest in the way sha256:aa.... Please note this parameter, if set, will override the tag
        ## @param core.tika.image.pullPolicy tika image pull policy
        ## @param core.tika.image.pullSecrets Specify image pull secrets
        ## @param core.tika.image.debug Specify if debug values should be set
        ##
        image:
            registry: docker.io
            repository: apache/tika
            tag: "3.3.0.0-full"
            digest: ""
            ## Specify a imagePullPolicy
            ## ref: https://kubernetes.io/docs/concepts/containers/images/#pre-pulled-images
            ##
            pullPolicy: IfNotPresent
            ## Optionally specify an array of imagePullSecrets.
            ## Secrets must be manually created in the namespace.
            ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
            ## e.g:
            ## pullSecrets:
            ##   - myRegistryKeySecretName
            ##
            pullSecrets: [ ]
            ## Enable debug mode
            ##
            debug: false
        ## tika service configuration
        ##
        service:
            ## @param core.tika.service.type Kubernetes Service type
            ##
            type: ClusterIP
            ## @param core.tika.service.port tika service port
            ##
            port: 9998
            ## @param core.tika.service.labels Map of labels to add to the tika service
            ##
            labels: { }
            ## @param core.tika.service.annotations Annotations for tika service
            ##
            annotations: { }
        ## @param core.tika.extraEnvVars Array with extra environment variables to add to tika container
        ## e.g:
        ## extraEnvVars:
        ##   - name: FOO
        ##     value: "bar"
        ##
        extraEnvVars: [ ]
        ## Configure extra options for tika container liveness, readiness and startup probes
        ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/#configure-probes
        ## @param core.tika.livenessProbe.enabled Enable livenessProbe on tika container
        ## @param core.tika.livenessProbe.initialDelaySeconds Initial delay seconds for livenessProbe
        ## @param core.tika.livenessProbe.periodSeconds Period seconds for livenessProbe
        ## @param core.tika.livenessProbe.timeoutSeconds Timeout seconds for livenessProbe
        ## @param core.tika.livenessProbe.failureThreshold Failure threshold for livenessProbe
        ## @param core.tika.livenessProbe.successThreshold Success threshold for livenessProbe
        ##
        livenessProbe:
            enabled: true
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 30
            failureThreshold: 20
            successThreshold: 1
        ## @param core.tika.readinessProbe.enabled Enable readinessProbe on tika container
        ## @param core.tika.readinessProbe.initialDelaySeconds Initial delay seconds for readinessProbe
        ## @param core.tika.readinessProbe.periodSeconds Period seconds for readinessProbe
        ## @param core.tika.readinessProbe.timeoutSeconds Timeout seconds for readinessProbe
        ## @param core.tika.readinessProbe.failureThreshold Failure threshold for readinessProbe
        ## @param core.tika.readinessProbe.successThreshold Success threshold for readinessProbe
        ##
        readinessProbe:
            enabled: true
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 30
            failureThreshold: 20
            successThreshold: 1
        ## @param core.tika.startupProbe.enabled Enable startupProbe on tika container
        ## @param core.tika.startupProbe.initialDelaySeconds Initial delay seconds for startupProbe
        ## @param core.tika.startupProbe.periodSeconds Period seconds for startupProbe
        ## @param core.tika.startupProbe.timeoutSeconds Timeout seconds for startupProbe
        ## @param core.tika.startupProbe.failureThreshold Failure threshold for startupProbe
        ## @param core.tika.startupProbe.successThreshold Success threshold for startupProbe
        ##
        startupProbe:
            enabled: true
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 30
            failureThreshold: 20
            successThreshold: 1
        ## @param core.tika.resources Set container requests and limits for different resources like CPU or memory (essential for production workloads)
        ## Example:
        ## resources:
        ##   requests:
        ##     cpu: 2
        ##     memory: 512Mi
        ##   limits:
        ##     cpu: 3
        ##     memory: 1024Mi
        ##
        resources: { }
        ## Container Security Context
        ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
        ## @param tika.containerSecurityContext.enabled Enabled containers' Security Context
        ## @param tika.containerSecurityContext.seLinuxOptions [object,nullable] Set SELinux options in container
        ## @param tika.containerSecurityContext.runAsUser Set containers' Security Context runAsUser
        ## @param tika.containerSecurityContext.runAsGroup Set containers' Security Context runAsGroup
        ## @param tika.containerSecurityContext.runAsNonRoot Set container's Security Context runAsNonRoot
        ## @param tika.containerSecurityContext.privileged Set container's Security Context privileged
        ## @param tika.containerSecurityContext.readOnlyRootFilesystem Set container's Security Context readOnlyRootFilesystem
        ## @param tika.containerSecurityContext.allowPrivilegeEscalation Set container's Security Context allowPrivilegeEscalation
        ## @param tika.containerSecurityContext.capabilities.drop List of capabilities to be dropped
        ## @param tika.containerSecurityContext.seccompProfile.type Set container's Security Context seccomp profile
        ##
        containerSecurityContext:
            enabled: true
            seLinuxOptions: { }
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            privileged: false
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
                drop: [ "ALL" ]
            seccompProfile:
                type: "RuntimeDefault"
        ## @param tika.extraVolumeMounts Optionally specify extra list of additional volumeMounts for the tika container
        ##
        extraVolumeMounts: [ ]
    gotenberg:
        ## @param core.gotenberg.enabled Enable gotenberg service
        enabled: true
        ## gotenberg image version
        ## @param core.gotenberg.image.registry gotenberg image registry
        ## @param core.gotenberg.image.repository gotenberg image repository
        ## @skip core.gotenberg.image.tag gotenberg image tag (immutable tags are recommended)
        ## @param core.gotenberg.image.digest gotenberg image digest in the way sha256:aa.... Please note this parameter, if set, will override the tag
        ## @param core.gotenberg.image.pullPolicy gotenberg image pull policy
        ## @param core.gotenberg.image.pullSecrets Specify image pull secrets
        ## @param core.gotenberg.image.debug Specify if debug values should be set
        ##
        image:
            registry: docker.io
            repository: gotenberg/gotenberg
            tag: "8.36.0"
            digest: ""
            ## Specify a imagePullPolicy
            ## ref: https://kubernetes.io/docs/concepts/containers/images/#pre-pulled-images
            ##
            pullPolicy: IfNotPresent
            ## Optionally specify an array of imagePullSecrets.
            ## Secrets must be manually created in the namespace.
            ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
            ## e.g:
            ## pullSecrets:
            ##   - myRegistryKeySecretName
            ##
            pullSecrets: [ ]
