        ## @param gotenberg.containerSecurityContext.enabled Enabled containers' Security Context
        ## @param gotenberg.containerSecurityContext.seLinuxOptions [object,nullable] Set SELinux options in container
        ## @param gotenberg.containerSecurityContext.runAsUser Set containers' Security Context runAsUser
        ## @param gotenberg.containerSecurityContext.runAsGroup Set containers' Security Context runAsGroup
        ## @param gotenberg.containerSecurityContext.runAsNonRoot Set container's Security Context runAsNonRoot
        ## @param gotenberg.containerSecurityContext.privileged Set container's Security Context privileged
        ## @param gotenberg.containerSecurityContext.readOnlyRootFilesystem Set container's Security Context readOnlyRootFilesystem
        ## @param gotenberg.containerSecurityContext.allowPrivilegeEscalation Set container's Security Context allowPrivilegeEscalation
        ## @param gotenberg.containerSecurityContext.capabilities.drop List of capabilities to be dropped
        ## @param gotenberg.containerSecurityContext.seccompProfile.type Set container's Security Context seccomp profile
        ##
        containerSecurityContext:
            enabled: true
            seLinuxOptions: { }
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            privileged: false
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
                drop: [ "ALL" ]
            seccompProfile:
                type: "RuntimeDefault"
        ## @param gotenberg.extraVolumeMounts Optionally specify extra list of additional volumeMounts for the gotenberg container
        ##
        extraVolumeMounts: [ ]
## @section webserver parameters
##
webserver:
    ## @param webserver.labels Map of labels to add to webserver deployment
    ##
    labels: { }
    ## @param webserver.annotations Annotations for webserver pod
    ##
    annotations: { }
    ## @param webserver.podLabels Map of labels to add to webserver pod
    ##
    podLabels: { }
    ## @param webserver.podAnnotations Map of annotations to add to webserver pod
    ##
    podAnnotations: { }
    ## @param webserver.replicaCount Number of webserver replicas
    ##
    replicaCount: 1
    ## webserver deployment strategy
    ## @param webserver.strategy.type webserver strategy type or if using SQLite database it uses Recreate update to avoid overlapping volume mounts
    ##
    strategy:
        type: RollingUpdate
    ## webserver service configuration
    ##
    service:
        ## @param webserver.service.type Kubernetes Service type
        ##
        type: ClusterIP
        ## @param webserver.service.port webserver service port
        ##
        port: 80
        ## @param webserver.service.labels Map of labels to add to the webserver service
        ##
        labels: { }
        ## @param webserver.service.annotations Annotations for webserver service
        ##
        annotations: { }
    ## @param webserver.extraEnvVars Array with extra environment variables to add to webserver container
    ## e.g:
    ## extraEnvVars:
    ##   - name: FOO
    ##     value: "bar"
    ##
    extraEnvVars: [ ]
    ## Configure extra options for webserver container liveness, readiness and startup probes
    ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/#configure-probes
    ## @param webserver.livenessProbe.enabled Enable livenessProbe on webserver container
    ## @param webserver.livenessProbe.initialDelaySeconds Initial delay seconds for livenessProbe
    ## @param webserver.livenessProbe.periodSeconds Period seconds for livenessProbe
    ## @param webserver.livenessProbe.timeoutSeconds Timeout seconds for livenessProbe
    ## @param webserver.livenessProbe.failureThreshold Failure threshold for livenessProbe
    ## @param webserver.livenessProbe.successThreshold Success threshold for livenessProbe
    ##
    livenessProbe:
        enabled: true
        initialDelaySeconds: 0
        periodSeconds: 30
        timeoutSeconds: 1
        failureThreshold: 6
        successThreshold: 1
    ## @param webserver.readinessProbe.enabled Enable readinessProbe on webserver container
    ## @param webserver.readinessProbe.initialDelaySeconds Initial delay seconds for readinessProbe
    ## @param webserver.readinessProbe.periodSeconds Period seconds for readinessProbe
    ## @param webserver.readinessProbe.timeoutSeconds Timeout seconds for readinessProbe
    ## @param webserver.readinessProbe.failureThreshold Failure threshold for readinessProbe
    ## @param webserver.readinessProbe.successThreshold Success threshold for readinessProbe
    ##
    readinessProbe:
        enabled: true
        initialDelaySeconds: 0
        periodSeconds: 10
        timeoutSeconds: 1
        failureThreshold: 6
        successThreshold: 1
    ## @param webserver.startupProbe.enabled Enable startupProbe on webserver container
    ## @param webserver.startupProbe.initialDelaySeconds Initial delay seconds for startupProbe
    ## @param webserver.startupProbe.periodSeconds Period seconds for startupProbe
    ## @param webserver.startupProbe.timeoutSeconds Timeout seconds for startupProbe
    ## @param webserver.startupProbe.failureThreshold Failure threshold for startupProbe
    ## @param webserver.startupProbe.successThreshold Success threshold for startupProbe
    ##
    startupProbe:
        enabled: true
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 1
        failureThreshold: 15
        successThreshold: 1
    ## @param webserver.resources Set container requests and limits for different resources like CPU or memory (essential for production workloads)
    ## Example:
    ## resources:
    ##   requests:
    ##     cpu: 2
    ##     memory: 512Mi
    ##   limits:
    ##     cpu: 3
    ##     memory: 1024Mi
    ##
    resources: { }
    ## Pod Security Context
    ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
    ## @param webserver.podSecurityContext.enabled Enable security context
    ## @param webserver.podSecurityContext.fsGroupChangePolicy Set filesystem group change policy
    ## @param webserver.podSecurityContext.fsGroup Group ID for the pod
    ##
    podSecurityContext:
        enabled: true
        fsGroupChangePolicy: OnRootMismatch
        fsGroup: 1000
    ## Container Security Context
    ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
    ## @param webserver.containerSecurityContext.enabled Enabled containers' Security Context
    ## @param webserver.containerSecurityContext.seLinuxOptions [object,nullable] Set SELinux options in container
    ## @param webserver.containerSecurityContext.runAsUser Set containers' Security Context runAsUser
    ## @param webserver.containerSecurityContext.runAsGroup Set containers' Security Context runAsGroup
    ## @param webserver.containerSecurityContext.runAsNonRoot Set container's Security Context runAsNonRoot
    ## @param webserver.containerSecurityContext.privileged Set container's Security Context privileged
    ## @param webserver.containerSecurityContext.readOnlyRootFilesystem Set container's Security Context readOnlyRootFilesystem
    ## @param webserver.containerSecurityContext.allowPrivilegeEscalation Set container's Security Context allowPrivilegeEscalation
    ## @param webserver.containerSecurityContext.capabilities.drop List of capabilities to be dropped
    ## @param webserver.containerSecurityContext.seccompProfile.type Set container's Security Context seccomp profile
    ##
    containerSecurityContext:
        enabled: true
        seLinuxOptions: { }
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        privileged: false
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
            drop: [ "ALL" ]
        seccompProfile:
            type: "RuntimeDefault"
    ## @param webserver.extraVolumeMounts Optionally specify extra list of additional volumeMounts for the webserver container
    ##
    extraVolumeMounts: [ ]
    ## @param webserver.extraVolumes Optionally specify extra list of additional volumes for the webserver container
    ##
    extraVolumes: [ ]
    ## @param webserver.affinity Affinity for webserver pods assignment
    ## ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
